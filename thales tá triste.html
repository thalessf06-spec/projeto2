<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Dino - Jogo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#dff4ff, #ffffff);
}

/* CÉU */

.sky {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.sun {
    position: absolute; 
    width: 70px;
    height: 70px;
    right: 12%;
    top: 10%;
    border-radius: 50%;
    background: #ffd84d;
    box-shadow: 0 0 35px #ffd84d;
}

.cloud {
    position: absolute;
    width: 90px;
    height: 28px;
    background: white;
    border-radius: 30px;
    opacity: .85;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 40px;
    height: 40px;
    left: 15px;
    bottom: 5px;
}

.cloud::after {
    width: 50px;
    height: 50px;
    right: 10px;
    bottom: 0;
}

.cloud1 {
    top: 18%;
    left: 15%;
    transform: scale(.8);
}

.cloud2 {
    top: 30%;
    left: 55%;
    transform: scale(.6);
}

.cloud3 {
    top: 12%;
    left: 80%;
    transform: scale(.5);
}

/* PLACAR */

#score {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 22px;
    font-weight: bold;
    color: #444;
    z-index: 20;
}

#best {
    position: absolute;
    top: 50px;
    right: 25px;
    font-size: 14px;
    color: #777;
    z-index: 20;
}

/* CHÃO */

#ground {
    position: absolute;
    bottom: 90px;
    left: 0;
    width: 100%;
    height: 5px;
    background: #444;
}

.groundLine {
    position: absolute;
    bottom: 91px;
    height: 4px;
    width: 40px;
    background: #777;
}

/* DINOSSAURO */

#player {
    position: absolute;
    left: 90px;
    bottom: 95px;
    width: 55px;
    height: 65px;
    z-index: 10;
}

.dino-body {
    position: absolute;
    width: 37px;
    height: 45px;
    background: #333;
    right: 2px;
    bottom: 0;
    border-radius: 5px 8px 2px 2px;
}

.dino-head {
    position: absolute;
    width: 40px;
    height: 30px;
    right: 0;
    top: 0;
    background: #333;
    border-radius: 5px 8px 2px 2px;
}

.dino-head::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    right: 7px;
    top: 7px;
}

.dino-tail {
    position: absolute;
    width: 25px;
    height: 12px;
    background: #333;
    left: 0;
    bottom: 14px;
    transform: rotate(-20deg);
}

.leg {
    position: absolute;
    width: 9px;
    height: 20px;
    background: #333;
    bottom: -13px;
}

.leg1 {
    right: 24px;
}

.leg2 {
    right: 5px;
}

/* OBSTÁCULOS */

.obstacle {
    position: absolute;
    bottom: 95px;
    background: #287a38;
    z-index: 8;
}

.cactus {
    width: 22px;
    height: 50px;
    border-radius: 5px;
}

.cactus::before,
.cactus::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 25px;
    background: #287a38;
    border-radius: 5px;
}

.cactus::before {
    left: -10px;
    top: 17px;
}

.cactus::after {
    right: -10px;
    top: 8px;
}

.bigCactus {
    width: 30px;
    height: 70px;
}

/* PÁSSARO */

.bird {
    position: absolute;
    width: 50px;
    height: 25px;
    background: transparent;
    z-index: 8;
}

.bird::before {
    content: "🦅";
    font-size: 35px;
}

/* TELA INICIAL */

#startScreen,
#gameOver {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255,255,255,.88);
    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: 50px;
    color: #333;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

button {
    border: none;
    background: #333;
    color: white;
    padding: 14px 30px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: scale(1.05);
    background: #111;
}

.instructions {
    margin-top: 20px;
    color: #777;
    font-size: 14px;
}

/* CELULAR */

#mobileButton {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    width: 100px;
    height: 55px;
    border-radius: 30px;
    background: rgba(0,0,0,.6);
    color: white;
    font-size: 25px;
}

/* EFEITO GAME OVER */

.shake {
    animation: shake .25s linear;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
}

.dark {
    background: linear-gradient(#172033, #29344a) !important;
}

.dark .sun {
    background: #f4f4f4;
    box-shadow: 0 0 20px #fff;
}

.dark .cloud {
    opacity: .15;
}

.dark #score {
    color: white;
}

.dark #best {
    color: #bbb;
}

@media (max-width: 600px) {
    h1 {
        font-size: 38px;
    }

    #player {
        left: 50px;
    }

    #mobileButton {
        display: block;
    }

    #score {
        top: 15px;
        right: 15px;
        font-size: 18px;
    }

    #best {
        top: 42px;
        right: 15px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="sky">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <div id="score">00000</div>
    <div id="best">RECORDE: 00000</div>

    <div id="ground"></div>

    <div id="player">
        <div class="dino-tail"></div>
        <div class="dino-body"></div>
        <div class="dino-head"></div>
        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
    </div>

    <button id="mobileButton">⬆</button>

    <div id="startScreen">
        <h1>🦖 RUN DINO</h1>
        <div class="subtitle">Corra o máximo que conseguir!</div>
        <button id="startButton">COMEÇAR</button>
        <div class="instructions">
            Espaço / ↑ para pular<br>
            Evite os obstáculos!
        </div>
    </div>

    <div id="gameOver">
        <h1>💥 GAME OVER</h1>
        <div class="subtitle">
            Pontuação: <strong id="finalScore">0</strong>
        </div>
        <button id="restartButton">JOGAR NOVAMENTE</button>
        <div class="instructions">
            Pressione Espaço para jogar novamente
        </div>
    </div>

</div>

<script>

/* =========================
   CONFIGURAÇÕES
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const finalScore = document.getElementById("finalScore");
const mobileButton = document.getElementById("mobileButton");

let running = false;
let gameOver = false;

let score = 0;
let best = Number(localStorage.getItem("dinoBest")) || 0;

let speed = 7;
let gravity = 0.8;

let playerY = 0;
let velocityY = 0;
let jumping = false;

let obstacles = [];
let groundLines = [];

let obstacleTimer = 0;
let groundTimer = 0;

let lastTime = 0;

/* =========================
   RECORDE
========================= */

bestElement.textContent =
    "RECORDE: " + String(best).padStart(5, "0");

/* =========================
   SOM
========================= */

let audioContext;

function sound(type) {

    try {

        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "jump") {
            oscillator.frequency.value = 420;
            oscillator.type = "square";
        }

        if (type === "score") {
            oscillator.frequency.value = 700;
            oscillator.type = "sine";
        }

        if (type === "hit") {
            oscillator.frequency.value = 100;
            oscillator.type = "sawtooth";
        }

        gain.gain.setValueAtTime(
            0.05,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + .15
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .15
        );

    } catch(e) {}

}

/* =========================
   COMEÇAR
========================= */

function startGame() {

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    running = true;
    gameOver = false;

    score = 0;
    speed = 7;

    playerY = 0;
    velocityY = 0;
    jumping = false;

    obstacles.forEach(o => o.remove());
    obstacles = [];

    groundLines.forEach(g => g.remove());
    groundLines = [];

    obstacleTimer = 0;
    groundTimer = 0;

    lastTime = performance.now();

    requestAnimationFrame(loop);
}

/* =========================
   PULO
========================= */

function jump() {

    if (!running) return;

    if (!jumping) {

        jumping = true;

        velocityY = 15;

        sound("jump");
    }

}

/* =========================
   CRIAR OBSTÁCULO
========================= */

function createObstacle() {

    const obstacle = document.createElement("div");

    const random = Math.random();

    if (random < .75) {

        obstacle.className =
            "obstacle cactus";

        if (Math.random() < .25) {
            obstacle.classList.add("bigCactus");
        }

    } else {

        obstacle.className =
            "obstacle bird";

        obstacle.style.bottom =
            (145 + Math.random() * 70) + "px";

    }

    obstacle.style.left =
        window.innerWidth + "px";

    game.appendChild(obstacle);

    obstacles.push(obstacle);
}

/* =========================
   CHÃO
========================= */

function createGroundLine() {

    const line =
        document.createElement("div");

    line.className = "groundLine";

    line.style.left =
        window.innerWidth + "px";

    game.appendChild(line);

    groundLines.push(line);
}

/* =========================
   COLISÃO
========================= */

function collision(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.right < r2.left + 8 ||
        r1.left + 8 > r2.right ||
        r1.bottom < r2.top + 8 ||
        r1.top + 8 > r2.bottom
    );

}

/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;
    gameOver = true;

    sound("hit");

    game.classList.add("shake");

    setTimeout(() => {
        game.classList.remove("shake");
    }, 300);

    if (score > best) {

        best = score;

        localStorage.setItem(
            "dinoBest",
            best
        );

    }

    finalScore.textContent = score;

    bestElement.textContent =
        "RECORDE: " +
        String(best).padStart(5, "0");

    gameOverScreen.style.display =
        "flex";
}

/* =========================
   LOOP PRINCIPAL
========================= */

function loop(time) {

    if (!running) return;

    const delta =
        Math.min((time - lastTime) / 16.67, 2);

    lastTime = time;

    /* PULO */

    if (jumping) {

        velocityY -= gravity * delta;

        playerY += velocityY * delta;

        if (playerY <= 0) {

            playerY = 0;

            velocityY = 0;

            jumping = false;

        }

    }

    player.style.transform =
        `translateY(${-playerY}px)`;

    /* VELOCIDADE */

    speed += 0.0015 * delta;

    /* PONTUAÇÃO */

    score += 0.08 * delta;

    const currentScore =
        Math.floor(score);

    scoreElement.textContent =
        String(currentScore)
        .padStart(5, "0");

    if (
        currentScore > 0 &&
        currentScore % 100 === 0
    ) {
        sound("score");
    }

    /* OBSTÁCULOS */

    obstacleTimer -= delta;

    if (obstacleTimer <= 0) {

        createObstacle();

        const minimum =
            Math.max(35, 85 - speed * 2);

        obstacleTimer =
            minimum +
            Math.random() * 50;
    }

    obstacles.forEach((obstacle, index) => {

        let x =
            parseFloat(
                obstacle.style.left
            );

        x -= speed * delta;

        obstacle.style.left = x + "px";

        if (collision(player, obstacle)) {
            endGame();
        }

        if (x < -100) {

            obstacle.remove();

            obstacles.splice(index, 1);
        }

    });

    /* LINHAS DO CHÃO */

    groundTimer -= delta;

    if (groundTimer <= 0) {

        createGroundLine();

        groundTimer = 20;
    }

    groundLines.forEach((line, index) => {

        let x =
            parseFloat(line.style.left);

        x -= speed * delta;

        line.style.left = x + "px";

        if (x < -60) {

            line.remove();

            groundLines.splice(index, 1);
        }

    });

    /* DIA / NOITE */

    const phase =
        Math.floor(score / 250) % 2;

    if (phase === 1) {
        game.classList.add("dark");
    } else {
        game.classList.remove("dark");
    }

    requestAnimationFrame(loop);
}

/* =========================
   CONTROLES
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            if (!running && !gameOver) {
                startGame();
            }
            else if (gameOver) {
                startGame();
            }
            else {
                jump();
            }

        }

    }
);

game.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.target === mobileButton
        ) return;

        event.preventDefault();

        if (!running) {
            startGame();
        } else {
            jump();
        }

    },
    { passive: false }
);

mobileButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        jump();

    },
    { passive: false }
);

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);

/* =========================
   EVITAR SCROLL
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {
            event.preventDefault();
        }

    }
);

</script>

</body>
</html>
